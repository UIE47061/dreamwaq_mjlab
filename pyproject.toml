[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dreamwaq-mjlab"
version = "0.1.0"
description = "DreamWaQ for Little White V3 with mjlab and standalone MuJoCo deployment"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.7", "mujoco~=3.11.0", "numpy", "pyyaml"]

[project.optional-dependencies]
train = ["mjlab", "rsl-rl-lib==5.5.0", "tensorboard>=2.20"]
dev = ["pytest>=8", "ruff"]
render = ["imageio[ffmpeg]", "matplotlib"]

[project.scripts]
dreamwaq-train = "dreamwaq_mjlab.learning.train:main"
dreamwaq-play = "dreamwaq_mjlab.deployment.play:main"
dreamwaq-eval = "dreamwaq_mjlab.deployment.evaluate:main"
dreamwaq-export = "dreamwaq_mjlab.deployment.export:main"
dreamwaq-sim2sim = "dreamwaq_mjlab.deployment.sim2sim:main"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "b517e0c489139e7fcee95702cfb2b01931264985" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["gpu: GPU integration test"]
addopts = "-m 'not gpu'"
